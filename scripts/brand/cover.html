<style>
  html,body{margin:0;padding:0;background:#000;}
  /* 1000px stage, rendered at deviceScaleFactor 3 -> 3000x3000 */
  #c{position:relative;width:1000px;height:1000px;background:#0a0a0a;overflow:hidden;}
  /* Nothing-style dot matrix: a repeating radial-gradient grid, deliberately
     low-contrast so the glyph reads first and the grid is texture, not noise. */
  #grid{position:absolute;inset:0;
    background-image:radial-gradient(circle at center, #2a2a2a 2.2px, transparent 2.6px);
    background-size:34px 34px;}
  /* Vignette so the corners fall away and the centre glyph carries the eye. */
  #vig{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 44%, transparent 30%, rgba(0,0,0,.85) 78%);}
  #bars{position:absolute;left:0;right:0;top:300px;height:320px;
    display:flex;align-items:center;justify-content:center;gap:34px;}
  .b{width:44px;border-radius:22px;background:#ff3b30;
     box-shadow:0 0 60px rgba(255,59,48,.55), 0 0 140px rgba(255,59,48,.25);}
  /* Same 7/13/19/13/7 ratio as the in-app WavrIcon, scaled up. */
  .b1{height:112px}.b2{height:208px}.b3{height:304px}.b4{height:208px}.b5{height:112px}
  #word{position:absolute;left:0;right:0;top:706px;text-align:center;
    font-family:'Doto',monospace;font-weight:700;font-size:104px;
    letter-spacing:.17em;color:#fff;text-indent:.17em;}
  #dot{position:absolute;left:50%;top:832px;transform:translateX(-50%);
    width:14px;height:14px;border-radius:50%;background:#ff3b30;
    box-shadow:0 0 24px rgba(255,59,48,.9);}
</style></head>
<body><div id="c">
  <div id="grid"></div><div id="vig"></div>
  <div id="bars">
    <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
    <div class="b b4"></div><div class="b b5"></div>
  </div>
  <div id="word">WAVEFM</div><div id="dot"></div>
</div></body></html>
